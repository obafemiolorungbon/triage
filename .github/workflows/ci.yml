name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: triage
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/triage
      REDIS_URL: redis://127.0.0.1:6379
      BETTER_AUTH_SECRET: ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci
      OPENROUTER_API_KEY: ''
      APP_URL: http://localhost:3000
      API_PUBLIC_URL: http://localhost:4200
      BETTER_AUTH_URL: http://localhost:4200
      NEXT_PUBLIC_API_URL: http://localhost:4200
      INTERNAL_API_URL: http://localhost:4200
      NEXT_PUBLIC_WIDGET_ORIGIN: http://localhost:3000
      NEXT_PUBLIC_WIDGET_KEY: local-dev-widget
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm exec prisma generate --schema=libs/db/prisma/schema.prisma

      - name: Prisma migrate (CI DB)
        run: pnpm exec prisma migrate deploy --schema=libs/db/prisma/schema.prisma

      - name: Lint public apps and backend
        run: pnpm exec nx run-many -t lint --projects=backend,@triage/flux,@triage/site,@triage/playground --parallel=1

      - name: Backend config safety tests
        run: pnpm exec nx run backend:test --testFile=apps/backend/src/config/env.schema.spec.ts

      - name: Build backend and web apps
        run: pnpm exec nx run-many -t build --projects=backend,@triage/flux,@triage/site,@triage/playground --parallel=1

      - name: Docker build smoke (API image)
        run: docker build -f apps/backend/Dockerfile .
