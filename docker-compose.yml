services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: triage
    ports:
      - '15432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 8

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      [
        '/bin/sh',
        '-c',
        'mc alias set local http://minio:9000 minioadmin minioadmin && mc mb -p local/triage-uploads || true',
      ]

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    ports:
      - '4200:4200'
    environment:
      NODE_ENV: production
      PORT: '4200'
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/triage
      REDIS_URL: redis://redis:6379
      APP_URL: http://localhost:3000
      API_PUBLIC_URL: http://localhost:4200
      BETTER_AUTH_URL: http://localhost:4200
      BETTER_AUTH_SECRET: change-this-secret-at-least-32-characters-long
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL_FILTER: ${OPENROUTER_MODEL_FILTER:-openai/gpt-4o-mini}
      OPENROUTER_MODEL_MAIN: ${OPENROUTER_MODEL_MAIN:-openai/gpt-4o}
      OPENROUTER_MODEL_EMBEDDING: ${OPENROUTER_MODEL_EMBEDDING:-openai/text-embedding-3-small}
      LINEAR_API_KEY: ${LINEAR_API_KEY:-}
      LINEAR_TEAM_ID: ${LINEAR_TEAM_ID:-}
      LINEAR_PROJECT_ID: ${LINEAR_PROJECT_ID:-}
      JIRA_BASE_URL: ${JIRA_BASE_URL:-}
      JIRA_EMAIL: ${JIRA_EMAIL:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
      JIRA_PROJECT_KEY: ${JIRA_PROJECT_KEY:-}
      JIRA_ISSUE_TYPE: ${JIRA_ISSUE_TYPE:-Task}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET: triage-uploads
      S3_FORCE_PATH_STYLE: 'true'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:4200/api/v1/health/ready', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 8
      start_period: 45s

  worker:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    entrypoint: ['/entry.sh']
    command: ['worker']
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/triage
      REDIS_URL: redis://redis:6379
      APP_URL: http://localhost:3000
      API_PUBLIC_URL: http://localhost:4200
      BETTER_AUTH_URL: http://localhost:4200
      BETTER_AUTH_SECRET: change-this-secret-at-least-32-characters-long
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL_FILTER: ${OPENROUTER_MODEL_FILTER:-openai/gpt-4o-mini}
      OPENROUTER_MODEL_MAIN: ${OPENROUTER_MODEL_MAIN:-openai/gpt-4o}
      OPENROUTER_MODEL_EMBEDDING: ${OPENROUTER_MODEL_EMBEDDING:-openai/text-embedding-3-small}
      LINEAR_API_KEY: ${LINEAR_API_KEY:-}
      LINEAR_TEAM_ID: ${LINEAR_TEAM_ID:-}
      LINEAR_PROJECT_ID: ${LINEAR_PROJECT_ID:-}
      JIRA_BASE_URL: ${JIRA_BASE_URL:-}
      JIRA_EMAIL: ${JIRA_EMAIL:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
      JIRA_PROJECT_KEY: ${JIRA_PROJECT_KEY:-}
      JIRA_ISSUE_TYPE: ${JIRA_ISSUE_TYPE:-Task}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET: triage-uploads
      S3_FORCE_PATH_STYLE: 'true'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  flux:
    build:
      context: .
      dockerfile: apps/flux/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4200
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:4200
      INTERNAL_API_URL: http://backend:4200
      BACKEND_URL: http://backend:4200
    depends_on:
      backend:
        condition: service_healthy

  site:
    build:
      context: .
      dockerfile: apps/site/Dockerfile
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: production

  playground:
    build:
      context: .
      dockerfile: apps/playground/Dockerfile
      args:
        NEXT_PUBLIC_WIDGET_ORIGIN: http://localhost:3000
        NEXT_PUBLIC_WIDGET_KEY: local-dev-widget
    ports:
      - '3002:3002'
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_WIDGET_ORIGIN: http://localhost:3000
      NEXT_PUBLIC_WIDGET_KEY: local-dev-widget
    depends_on:
      flux:
        condition: service_started

volumes:
  pgdata: {}
  miniodata: {}
